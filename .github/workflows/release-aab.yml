name: 2 - Build Play Store AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kum-upload.jks"
      - name: Build release bundle
        env:
          KUM_KEYSTORE_PATH: ${{ runner.temp }}/kum-upload.jks
          KUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: KUM-play-store-aab
          path: app/build/outputs/bundle/release/app-release.aab
