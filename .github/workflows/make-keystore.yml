name: 1 - Create upload keystore (run once)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore kum-upload.jks -alias kum \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=KUM"
          base64 -w 0 kum-upload.jks > keystore-base64.txt
          {
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD      = $PASS"
            echo "KEY_ALIAS         = kum"
            echo "KEYSTORE_BASE64   = (the long text inside keystore-base64.txt)"
          } > keystore-info.txt
      - name: Upload keystore (private, kept 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: KUM-upload-keystore
          path: |
            kum-upload.jks
            keystore-base64.txt
            keystore-info.txt
          retention-days: 1
